<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Լիլիթի Ծննդյան Հրավեր</title>
    
    <!-- Նուրբ և շքեղ տառատեսակներ -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FAF9F6; /* Կրեմագույն */
            --card-bg: #FFFFFF;
            --rose-gold: #B76E79;
            --gold: #D4AF37;
            --text-dark: #2C2C2C;
            --text-muted: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
            background-image: radial-gradient(#D4AF37 0.5px, transparent 0.5px), radial-gradient(#D4AF37 0.5px, var(--bg-color) 0.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-attachment: fixed;
        }

        /* Լեզվի փոխարկիչ */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid var(--rose-gold);
            box-shadow: 0 4px 15px rgba(183, 110, 121, 0.15);
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            color: var(--rose-gold);
            font-weight: 600;
        }

        /* Երաժշտության կոճակ */
        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--rose-gold);
            color: var(--rose-gold);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(183, 110, 121, 0.2);
        }

        .music-btn:hover { transform: scale(1.1); }
        .music-btn.playing i { animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        /* Գլխավոր մաս */
        .hero-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .hero-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(4rem, 12vw, 8rem);
            color: var(--rose-gold);
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        .hero-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold);
            margin-top: 10px;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--rose-gold), transparent);
            margin: 25px auto;
        }

        /* Հետհաշվարկ */
        .countdown-container {
            display: flex;
            gap: 25px;
            margin-top: 40px;
        }

        .countdown-box { text-align: center; }
        .countdown-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--rose-gold);
            display: block;
            line-height: 1;
        }
        .countdown-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Մանրամասներ և Քարտ */
        .details-card {
            background: var(--card-bg);
            border: 1px solid rgba(183, 110, 121, 0.2);
            padding: 50px 40px;
            border-radius: 8px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(183, 110, 121, 0.1);
        }

        .details-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: var(--rose-gold);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .detail-item {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .detail-item i {
            color: var(--gold);
            font-size: 1.1rem;
            width: 20px;
        }

        .detail-item span {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            letter-spacing: 1px;
        }

        /* Քարտեզ */
        .map-container {
            width: 100%;
            max-width: 600px;
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(183, 110, 121, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .map-container iframe {
            width: 100%;
            height: 300px;
            border: none;
        }

        /* RSVP Կոճակ */
        .rsvp-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 16px 40px;
            background: var(--rose-gold);
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.4s ease;
            box-shadow: 0 5px 20px rgba(183, 110, 121, 0.3);
        }

        .rsvp-btn:hover {
            background: #a05a63;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(183, 110, 121, 0.4);
        }

        .footer {
            padding: 40px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-align: center;
        }

        /* Անիմացիաներ */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .countdown-container { gap: 15px; }
            .countdown-num { font-size: 2rem; }
            .details-card { padding: 40px 25px; }
            .hero-name { font-size: 4.5rem; }
        }
    </style>
</head>
<body>

    <!-- Լեզվի փոխարկիչ -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('am')">ՀԱՅ</button>
        <button class="lang-btn" onclick="setLanguage('en')">ENG</button>
        <button class="lang-btn" onclick="setLanguage('ru')">РУС</button>
    </div>

    <!-- Երաժշտության կոճակ -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        <i class="fas fa-music"></i>
    </button>

    <!-- Աուդիո -->
    <audio id="bgMusic" loop>
        <source src="birthday-song.mp3" type="audio/mpeg">
    </audio>

    <!-- Գլխավոր մաս -->
    <section>
        <p class="hero-subtitle" data-lang-key="subtitle">Սիրով հրավիրում ենք Ձեզ</p>
        <h1 class="hero-name">Լիլիթ</h1>
        <div class="divider"></div>
        <p class="hero-date" data-lang-key="heroDate">Հոկտեմբերի 11, 2026</p>
        
        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-num" id="days">00</span>
                <span class="countdown-label" data-lang-key="days">Օր</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="hours">00</span>
                <span class="countdown-label" data-lang-key="hours">Ժամ</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="minutes">00</span>
                <span class="countdown-label" data-lang-key="minutes">Րոպե</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="seconds">00</span>
                <span class="countdown-label" data-lang-key="seconds">Վայրկյան</span>
            </div>
        </div>
    </section>

    <!-- Մանրամասներ -->
    <section>
        <div class="details-card reveal">
            <h2 data-lang-key="detailsTitle">Միջոցառման մանրամասներ</h2>
            
            <div class="detail-item">
                <i class="far fa-calendar-alt"></i>
                <span data-lang-key="dateDetail">Կիրակի, Հոկտեմբերի 11, 2026</span>
            </div>
            
            <div class="detail-item">
                <i class="far fa-clock"></i>
                <span data-lang-key="timeDetail">Ժամը 17:00</span>
            </div>
            
            <div class="detail-item">
                <i class="fas fa-map-marker-alt"></i>
                <span data-lang-key="locationDetail">Ապոլո, Երևան</span>
            </div>

            <div class="map-container">
                <iframe src="https://www.google.com/maps?q=Apollo+Yerevan&output=embed" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </section>

    <!-- RSVP -->
    <section>
        <div class="reveal">
            <h2 style="font-size: 2rem; color: var(--rose-gold); margin-bottom: 15px;" data-lang-key="rsvpTitle">Խնդրում ենք հաստատել</h2>
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 5px;" data-lang-key="rsvpText">Սպասում ենք Ձեզ մեր տոնակատարությանը:</p>
            <p style="color: var(--gold); font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 500; margin-bottom: 25px;">077 599195</p>
            
            <a href="https://wa.me/37477599195?text=" id="waLink" target="_blank" class="rsvp-btn">
                <i class="fab fa-whatsapp"></i>
                <span data-lang-key="rsvpBtn">Հաստատել WhatsApp-ով</span>
            </a>
        </div>
    </section>

    <footer class="footer">
        <p data-lang-key="footer">Սիրով՝ Լիլիթի ընտանիք</p>
    </footer>

    <script>
        const translations = {
            am: {
                subtitle: "Սիրով հրավիրում ենք Ձեզ",
                heroDate: "Հոկտեմբերի 11, 2026",
                days: "Օր", hours: "Ժամ", minutes: "Րոպե", seconds: "Վայրկյան",
                detailsTitle: "Միջոցառման մանրամասներ",
                dateDetail: "Կիրակի, Հոկտեմբերի 11, 2026",
                timeDetail: "Ժամը 17:00",
                locationDetail: "Ապոլո, Երևան",
                rsvpTitle: "Խնդրում ենք հաստատել",
                rsvpText: "Սպասում ենք Ձեզ մեր տոնակատարությանը:",
                rsvpBtn: "Հաստատել WhatsApp-ով",
                footer: "Սիրով՝ Լիլիթի ընտանիք",
                waMsg: "Ողջույն: Ես ուրախությամբ կներկայանամ Լիլիթի ծննդյան երեկույթին:"
            },
            en: {
                subtitle: "You are cordially invited to",
                heroDate: "October 11, 2026",
                days: "Days", hours: "Hours", minutes: "Minutes", seconds: "Seconds",
                detailsTitle: "Event Details",
                dateDetail: "Sunday, October 11, 2026",
                timeDetail: "17:00",
                locationDetail: "Apollo, Yerevan",
                rsvpTitle: "Kindly Respond",
                rsvpText: "We look forward to celebrating with you.",
                rsvpBtn: "RSVP via WhatsApp",
                footer: "With love, Lilit's family",
                waMsg: "Hello! I will gladly attend Lilit's Birthday Party!"
            },
            ru: {
                subtitle: "Мы сердечно приглашаем вас на",
                heroDate: "11 октября 2026",
                days: "Дней", hours: "Часов", minutes: "Минут", seconds: "Секунд",
                detailsTitle: "Детали события",
                dateDetail: "Воскресенье, 11 октября 2026",
                timeDetail: "17:00",
                locationDetail: "Аполло, Ереван",
                rsvpTitle: "Просим подтвердить",
                rsvpText: "Мы с нетерпением ждем праздника вместе с вами.",
                rsvpBtn: "Подтвердить через WhatsApp",
                footer: "С любовью, семья Лилит",
                waMsg: "Привет! Я с радостью приду на День Рождения Лилит!"
            }
        };

        let currentLang = 'am';

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const keys = Object.keys(translations[lang]);
            keys.forEach(key => {
                if (key !== 'waMsg') {
                    const elements = document.querySelectorAll(`[data-lang-key="${key}"]`);
                    elements.forEach(el => el.textContent = translations[lang][key]);
                }
            });
            
            document.getElementById('waLink').href = "https://wa.me/37477599195?text=" + encodeURIComponent(translations[lang].waMsg);
        }

        // Հետհաշվարկ (Երևանի ժամանակով՝ UTC+4)
        const eventDate = new Date('2026-10-11T17:00:00+04:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                ["days", "hours", "minutes", "seconds"].forEach(id => document.getElementById(id).textContent = "00");
                return;
            }

            document.getElementById("days").textContent = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").textContent = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("minutes").textContent = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("seconds").textContent = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Երաժշտություն
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
                musicBtn.innerHTML = '<i class="fas fa-music"></i>';
            } else {
                bgMusic.play().catch(e => console.log("Audio play prevented"));
                musicBtn.classList.add('playing');
                musicBtn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            isPlaying = !isPlaying;
        }

        // Scroll անիմացիա
        window.addEventListener('scroll', () => {
            document.querySelectorAll('.reveal').forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) {
                    el.classList.add('active');
                }
            });
        });
        window.addEventListener('load', () => {
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
        });
        
        // Սկզբնական WhatsApp հղման թարմացում
        document.getElementById('waLink').href = "https://wa.me/37477599195?text=" + encodeURIComponent(translations.am.waMsg);
    </script>
</body>
</html>
